version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 50
    ignore:
      # next-auth v5 beta declares peerOptional nodemailer "^7.0.7 || ^8.0.5".
      # A major bump past 8 leaves npm unable to resolve the tree, which breaks
      # `npm ci` and the `npm prune --omit=dev` step of the Docker build.
      # Drop this entry once next-auth widens the peer range.
      - dependency-name: "nodemailer"
        update-types: ["version-update:semver-major"]
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
        update-types:
          - "major"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@typescript-eslint/*"
        update-types:
          - "major"
