services:
  app:
    image: ghcr.io/sirtheta/budget:latest
    container_name: budget
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "file:/app/data/budget.db"
      NODE_ENV: production
      # `docker compose up` works without a .env file: when AUTH_SECRET /
      # ENCRYPTION_KEY are not provided, the container generates random ones
      # on first start and persists them in the data volume (./data). To use
      # your own values, set them via .env (see .env.example) — explicitly
      # configured values always take precedence over generated ones.
      AUTH_SECRET: ${AUTH_SECRET:-}
      # Set this to the https:// address when the instance is served over TLS
      # (reverse proxy included): NextAuth marks the session cookie `Secure`
      # only for an https AUTH_URL. The container warns at startup otherwise.
      # node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      # node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Node's HTTP keep-alive timeout (ms). Must exceed the reverse proxy's
      # own upstream keep-alive timeout, or the proxy occasionally reuses a
      # connection Node already closed — the request then hangs silently with
      # no response and no server-side log line. 70000 covers Nginx Proxy
      # Manager's ~65-75s default; raise it further if your proxy's is higher.
      KEEP_ALIVE_TIMEOUT: ${KEEP_ALIVE_TIMEOUT:-70000}
      # Server timezone (log timestamps etc.). Which calendar day a recurring
      # booking is due on follows APP_TIMEZONE (default Europe/Zurich) and
      # works regardless of TZ.
      TZ: ${TZ:-Europe/Zurich}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/auth/session"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
