name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/dependabot.yml'
      - 'LICENSE'

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint

  test-and-build:
    name: Test & Build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Tests mit Coverage ausführen
        run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          retention-days: 14
      - name: Build ausführen
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Chromium installieren
        run: npx playwright install --with-deps chromium
      - name: E2E-Tests ausführen
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
